name: Release

# Publishes a GitHub Release for a version tag. Each release carries:
#
#   OpenMouseDesktopSetup.exe  the Windows installer. The file name never
#                              changes, so
#                              releases/latest/download/OpenMouseDesktopSetup.exe
#                              is a permanent "download the newest" link.
#   latest.json                what the app's update check reads
#                              (releases/latest/download/latest.json): version,
#                              notes, and the installer's URL and SHA-256.
#
# To release: bump `version` in gpui/Cargo.toml (and gpui/installer/Cargo.toml),
# add that version's entry to gpui/js/lib/changelog.ts, merge, then push a tag
# like v0.1.0 (or run this by hand with that tag). The tag, Cargo version and
# changelog entry must all agree or the run stops before publishing.
#
# `releases/latest` only resolves to the newest non-draft, non-prerelease
# release, so this publishes as one.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release, e.g. v0.1.0 (created from the selected branch if it does not exist)"
        required: true
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check the tag matches the app version
        shell: bash
        run: |
          version="${TAG#v}"
          cargo_version=$(sed -n 's/^version = "\(.*\)"/\1/p' gpui/Cargo.toml | head -1)
          installer_version=$(sed -n 's/^version = "\(.*\)"/\1/p' gpui/installer/Cargo.toml | head -1)
          if [ "$version" != "$cargo_version" ] || [ "$version" != "$installer_version" ]; then
            echo "::error::Tag $TAG, gpui/Cargo.toml ($cargo_version) and gpui/installer/Cargo.toml ($installer_version) must all be the same version."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Same cache the build workflow fills on main, installer included.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            gpui
            gpui/installer
          shared-key: windows

      - name: Install JS dependencies
        run: npm ci

      - name: Audit JavaScript dependencies
        run: npm audit --audit-level=low

      - name: Audit Rust dependencies
        shell: bash
        run: |
          cargo install cargo-audit --version 0.23.0 --locked
          cargo audit --file gpui/Cargo.lock --deny unsound --deny yanked
          cargo audit --file gpui/installer/Cargo.lock --deny unsound --deny yanked

      # A tag can point at any commit, so don't publish without the tests.
      # Cheap now: the shared cache already holds the test build.
      - name: Test
        run: cargo test
        working-directory: gpui

      - name: Build release binary
        run: cargo build --release
        working-directory: gpui

      # Embeds the app's release .exe as the installer's payload.
      - name: Build installer
        run: cargo build --release
        working-directory: gpui/installer

      - name: Collect release files
        shell: bash
        run: |
          mkdir release
          cp gpui/installer/target/release/openmouse-installer.exe release/OpenMouseDesktopSetup.exe
          node .github/scripts/make-release-files.mjs "$TAG" release/OpenMouseDesktopSetup.exe "$GITHUB_REPOSITORY" release
          cat release/latest.json

      - name: Package portable release and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-portable | Out-Null
          Copy-Item gpui/target/release/openmouse-gpui.exe release-portable/OpenMouseDesktop.exe
          Copy-Item .github/portable-readme.txt release-portable/README.txt
          "Commit: $env:GITHUB_SHA" | Set-Content release-portable/BUILD.txt
          Compress-Archive -Path release-portable/* -DestinationPath release/OpenMouseDesktopPortable.zip
          node .github/scripts/sha256-files.mjs release/SHA256SUMS.txt release/OpenMouseDesktopSetup.exe release/OpenMouseDesktopPortable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: release/
          if-no-files-found: error

  publish:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-files
          path: release

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" \
            release/OpenMouseDesktopSetup.exe release/OpenMouseDesktopPortable.zip release/SHA256SUMS.txt release/latest.json \
            --title "OpenMouse Desktop $TAG" \
            --notes-file release/notes.md \
            --target "$GITHUB_SHA" \
            --latest
